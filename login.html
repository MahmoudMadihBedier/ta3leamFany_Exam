<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <title>نظام الاختبارات الإلكترونية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
        }
        .top_bar {
            margin-bottom: 30px;
        }
        .navbar {
            background-color: #726b6b !important;
            padding: 10px 0;
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }
        .img-fluid {
            max-height: 300px;
        }
        .btn1 {
            background-color: #726b6b;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn1:hover {
            background-color: #5a5555;
        }
        .form-control {
            border-radius: 5px;
        }
        .footer-section {
            background-color: #f8f9fa;
            padding: 20px 0;
            margin-top: 50px;
            text-align: center;
        }
        .footer_section_text {
            margin: 0 auto;
        }
        .footer_section_link_icon {
            margin: 0 10px;
            color: #726b6b;
        }
        .question-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .hidden {
            display: none;
        }
        .progress {
            height: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Login Section -->
    <section id="loginSection" class="Form my-4 mx-4">
        <div class="container">
            <div class="gap_purpose"></div>
            <div class="row no-gutters from_row_div">
                <div class="col-lg-5 px-5 pt-5">
                    <img src="Main_Icon.png" class="img-fluid" alt="School Logo" />
                </div>
                <div class="col-lg-7 px-5 pt-5">
                    <h1 class="font-weight-bold py-3">مديريه التربيه والتعليم بالمنوفية<br> التعليم الفني التجاري</h1>
                    <h4 class="">سجل الدخول باستخدام الرمز السري للمدرسة</h4>
                    <form id="loginForm">
                        <div class="form-row">
                            <div class="col-lg-7">
                                <input
                                    id="schoolCode"
                                    type="password"
                                    placeholder="أدخل الرمز السري للمدرسة"
                                    class="form-control my-3 p-4"
                                    required
                                />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="col-lg-7">
                                <button type="submit" class="btn btn1 mt-3 mb-5">
                                    دخول
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Student Info Section -->
    <section id="studentInfoSection" class="Form my-4 mx-4 hidden">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h3 class="text-center">معلومات الطالب</h3>
                        </div>
                        <div class="card-body">
                            <form id="studentForm">
                                <div class="form-group">
                                    <label for="schoolName">اسم المدرسة:</label>
                                    <input type="text" class="form-control" id="schoolNameDisplay" readonly>
                                </div>
                                <div class="form-group">
                                    <label for="studentName">اسم الطالب:</label>
                                    <input type="text" class="form-control" id="studentName" required>
                                </div>
                                <div class="form-group">
                                    <label for="studentClass">الصف:</label>
                                    <input type="text" class="form-control" id="studentClass" required>
                                </div>
                                <button type="submit" class="btn btn-primary btn-block">بدء الاختبار</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Exam Section -->
    <section id="examSection" class="Form my-4 mx-4 hidden">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="card mb-4">
                        <div class="card-header bg-info text-white">
                            <div class="d-flex justify-content-between align-items-center">
                                <h4 id="examTitle">اختبار</h4>
                                <div id="timer" class="font-weight-bold">الوقت المتبقي: 30:00</div>
                            </div>
                            <div class="progress">
                                <div id="progressBar" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                    
                    <form id="examForm">
                        <!-- Questions will be inserted here by JavaScript -->
                        <div id="questionsContainer"></div>
                        
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-success btn-lg">إنهاء الاختبار</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Results Section -->
    <section id="resultsSection" class="Form my-4 mx-4 hidden">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header bg-success text-white">
                            <h3 class="text-center">تم إرسال الإجابات بنجاح</h3>
                        </div>
                        <div class="card-body text-center">
                            <i class="fas fa-check-circle text-success" style="font-size: 5rem; margin-bottom: 20px;"></i>
                            <h4>شكرا لك، <span id="resultStudentName"></span>!</h4>
                            <p class="lead">تم تسجيل إجاباتك بنجاح.</p>
                            <button id="restartExam" class="btn btn-primary">العودة إلى الصفحة الرئيسية</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer-section">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <i class="far fa-copyright">Copyright 2025 MahmoudMadih</i>
                    <p class="footer_section_text">تواصل معنا</p>
                    <p class="footer_section_text_link">
                        <a href="#" class="fab fa-facebook-f footer_section_link_icon"></a>
                        <a href="#" class="fab fa-twitter footer_section_link_icon"></a>
                        <a href="#" class="fab fa-instagram footer_section_link_icon"></a>
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js"></script>
    <script src="https://kit.fontawesome.com/1201071337.js" crossorigin="anonymous"></script>
    <script>
        // School codes (in a real app, these would be stored securely on the server)
        const schoolCodes = {
            "12345": "مدرسة المنوفية الثانوية الصناعية",
            "67890": "مدرسة شبين الكوم الثانوية التجارية",
            "54321": "مدرسة بركة السبع الفنية المتقدمة"
        };

        // Sample exam questions
        const examQuestions = [
            {
                type: "multiple_choice",
                question: "ما هي عاصمة مصر؟",
                options: ["الإسكندرية", "القاهرة", "الجيزة", "بورسعيد"],
                correctAnswer: 1
            },
            {
                type: "true_false",
                question: "الضوء ينتقل أسرع من الصوت.",
                correctAnswer: true
            },
            {
                type: "choose_from_list",
                question: "اختر العنصر الذي ينتمي إلى مجموعة الهالوجينات:",
                options: ["الصوديوم", "الكلور", "الألومنيوم", "الحديد"],
                correctAnswer: 1
            },
            {
                type: "multiple_choice",
                question: "أي من هذه اللغات هي لغة برمجة؟",
                options: ["HTML", "CSS", "JavaScript", "XML"],
                correctAnswer: 2
            },
            {
                type: "true_false",
                question: "الشمس تدور حول الأرض.",
                correctAnswer: false
            }
        ];

        // Global variables
        let currentSchool = "";
        let studentInfo = {};
        let examAnswers = [];
        let timeLeft = 1800; // 30 minutes in seconds
        let timerInterval;

        // DOM ready
        $(document).ready(function() {
            // Login form submission
            $("#loginForm").submit(function(e) {
                e.preventDefault();
                const code = $("#schoolCode").val().trim();
                
                if (schoolCodes[code]) {
                    currentSchool = schoolCodes[code];
                    $("#schoolNameDisplay").val(currentSchool);
                    $("#loginSection").addClass("hidden");
                    $("#studentInfoSection").removeClass("hidden");
                } else {
                    alert("الرمز السري غير صحيح. الرجاء المحاولة مرة أخرى.");
                }
            });

            // Student info form submission
            $("#studentForm").submit(function(e) {
                e.preventDefault();
                studentInfo = {
                    name: $("#studentName").val().trim(),
                    class: $("#studentClass").val().trim(),
                    school: currentSchool,
                    timestamp: new Date().toISOString()
                };
                
                // Start the exam
                startExam();
            });

            // Exam form submission
            $("#examForm").submit(function(e) {
                e.preventDefault();
                collectAnswers();
                submitExam();
            });

            // Restart exam button
            $("#restartExam").click(function() {
                location.reload();
            });
        });

        // Start the exam
        function startExam() {
            $("#studentInfoSection").addClass("hidden");
            $("#examSection").removeClass("hidden");
            
            // Display questions
            const questionsContainer = $("#questionsContainer");
            questionsContainer.empty();
            
            examQuestions.forEach((question, index) => {
                const questionHtml = createQuestionHtml(question, index);
                questionsContainer.append(questionHtml);
            });
            
            // Start timer
            startTimer();
            
            // Update progress bar
            updateProgressBar();
        }

        // Create HTML for a question
        function createQuestionHtml(question, index) {
            let html = `
                <div class="question-card">
                    <h5>السؤال ${index + 1}: ${question.question}</h5>
            `;
            
            if (question.type === "multiple_choice" || question.type === "choose_from_list") {
                question.options.forEach((option, i) => {
                    html += `
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="q${index}" id="q${index}_o${i}" value="${i}">
                            <label class="form-check-label" for="q${index}_o${i}">
                                ${option}
                            </label>
                        </div>
                    `;
                });
            } else if (question.type === "true_false") {
                html += `
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="q${index}" id="q${index}_true" value="true">
                        <label class="form-check-label" for="q${index}_true">
                            صحيح
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="q${index}" id="q${index}_false" value="false">
                        <label class="form-check-label" for="q${index}_false">
                            خطأ
                        </label>
                    </div>
                `;
            }
            
            html += `</div>`;
            return html;
        }

        // Start the exam timer
        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(function() {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    collectAnswers();
                    submitExam();
                }
            }, 1000);
        }

        // Update timer display
        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            $("#timer").text(`الوقت المتبقي: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`);
        }

        // Update progress bar
        function updateProgressBar() {
            const answered = $("input[type='radio']:checked").length;
            const total = examQuestions.length;
            const percentage = (answered / total) * 100;
            $("#progressBar").css("width", percentage + "%");
            
            // Change color based on progress
            if (percentage < 30) {
                $("#progressBar").removeClass("bg-success bg-warning").addClass("bg-danger");
            } else if (percentage < 70) {
                $("#progressBar").removeClass("bg-success bg-danger").addClass("bg-warning");
            } else {
                $("#progressBar").removeClass("bg-warning bg-danger").addClass("bg-success");
            }
        }

        // Collect answers from the form
        function collectAnswers() {
            examAnswers = [];
            
            examQuestions.forEach((question, index) => {
                const selectedOption = $(`input[name="q${index}"]:checked`).val();
                examAnswers.push({
                    question: question.question,
                    answer: selectedOption !== undefined ? selectedOption : "لم يتم الإجابة",
                    correctAnswer: question.correctAnswer,
                    isCorrect: selectedOption == question.correctAnswer
                });
            });
            
            clearInterval(timerInterval);
        }

        // Submit exam data to Google Sheets
        function submitExam() {
            // In a real application, you would send this data to your server
            // which would then submit it to Google Sheets using the API
            
            // For this example, we'll simulate the submission
            console.log("Student Info:", studentInfo);
            console.log("Exam Answers:", examAnswers);
            
            // Prepare data for Google Sheets
            const dataForSheets = {
                studentName: studentInfo.name,
                studentClass: studentInfo.class,
                schoolName: studentInfo.school,
                timestamp: studentInfo.timestamp,
                answers: examAnswers.map(answer => answer.answer).join(" | "),
                score: examAnswers.filter(answer => answer.isCorrect).length + "/" + examAnswers.length
            };
            
            // In a real app, you would use the Google Sheets API here
            // For now, we'll just log it
            console.log("Data for Google Sheets:", dataForSheets);
            
            // Show results page
            showResults();
        }

        // Show results page
        function showResults() {
            $("#examSection").addClass("hidden");
            $("#resultsSection").removeClass("hidden");
            $("#resultStudentName").text(studentInfo.name);
        }

        // Update progress bar when an answer is selected
        $(document).on("change", "input[type='radio']", function() {
            updateProgressBar();
        });
    </script>
</body>
</html>
